services:
  db:
    container_name: db
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - default
    cpuset: "0"
    restart: unless-stopped

  ordering-service:
    container_name: ordering-service
    image: skrecovery
    network_mode: "host"
    volumes:
      - .:/skrecovery
    privileged: true
    # Use array form so the shell runs 'sleep && python' reliably
    command: ["sh", "-lc", "sleep 5 && python -m fabric.ordering_service"]
    depends_on:
      - db
    cpuset: "0"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

  noise-service:
    container_name: noise-service
    image: skrecovery
    network_mode: "host"
    volumes:
      - .:/skrecovery
    privileged: true
    command: ["sh", "-lc", "sleep 5 && python -m fabric.noise_simulation"]
    depends_on:
      - db
      - ordering-service
    cpuset: "0"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

  experiment:
    container_name: experiment
    image: skrecovery
    network_mode: "host"
    volumes:
      - .:/skrecovery
    devices:
      - "/dev/vsock:/dev/vsock"
    privileged: true
    # Pin verifier work to CPU 2
    cpuset: "2"
    cap_add:
      - SYS_NICE
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command: tail -f /dev/null
    restart: unless-stopped

networks:
  default:
    name: skrecovery_network

volumes:
  mongodata:
